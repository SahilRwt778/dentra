# Second deployment: create another Blueprint using this file after the API has a public URL.
# Keep the repository root available: Dentist Web depends on packages/dentra-call-core.
services:
  - type: web
    name: dentra-admin
    runtime: static
    buildCommand: npm --prefix dentra-web-admin ci --include=dev --legacy-peer-deps && npm --prefix dentra-web-admin run build
    staticPublishPath: dentra-web-admin/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: dentra-dentist
    runtime: static
    buildCommand: npm --prefix dentra-web-dentist ci --include=dev --legacy-peer-deps && npm --prefix dentra-web-dentist run build
    staticPublishPath: dentra-web-dentist/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: VITE_API_BASE_URL
        sync: false
